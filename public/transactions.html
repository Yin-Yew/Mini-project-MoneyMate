<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MoneyMate | Transactions</title>

<link rel="stylesheet" href="style.css">

<link
rel="stylesheet"
href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">

</head>

<body>

<div class="app">

<aside class="sidebar glass">

<div>

<div class="logo">

<div class="logo-icon">
<i class="ph-duotone ph-wallet"></i>
</div>

<span>MoneyMate</span>

</div>

<nav>

<a href="index.html">
<i class="ph-duotone ph-squares-four"></i>
<span>Dashboard</span>
</a>

<a class="active" href="transactions.html">
<i class="ph-duotone ph-receipt"></i>
<span>Transactions</span>
</a>

<a href="analytics.html">
<i class="ph-duotone ph-chart-line-up"></i>
<span>Analytics</span>
</a>

<a href="budget.html">
<i class="ph-duotone ph-target"></i>
<span>Budget & Goals</span>
</a>

<a href="calendar.html">
<i class="ph-duotone ph-calendar-dots"></i>
<span>Calendar</span>
</a>

<a href="settings.html">
<i class="ph-duotone ph-gear-six"></i>
<span>Settings</span>
</a>

</nav>

</div>

</aside>

<main>

<header class="top-header">

<div>

<p class="page-eyebrow">
Personal Finance
</p>

<h1>Transactions</h1>

<p>
Track every income and expense
</p>

</div>

<button
class="add-btn"
onclick="scrollToAddTransaction()">

<i class="ph-duotone ph-plus"></i>

Add Transaction

</button>

</header>

<section class="transaction-summary">

<div class="summary-mini glass">

<div class="summary-mini-icon income-mini">

<i class="ph-duotone ph-arrow-up-right"></i>

</div>

<div>

<p>Income</p>

<h3 id="transactionIncome">
฿0
</h3>

</div>

</div>

<div class="summary-mini glass">

<div class="summary-mini-icon expense-mini">

<i class="ph-duotone ph-arrow-down-right"></i>

</div>

<div>

<p>Expense</p>

<h3 id="transactionExpense">
฿0
</h3>

</div>

</div>

<div class="summary-mini glass">

<div class="summary-mini-icon balance-mini">

<i class="ph-duotone ph-wallet"></i>

</div>

<div>

<p>Balance</p>

<h3 id="transactionBalance">
฿0
</h3>

</div>

</div>

</section>

<section
class="form-card glass premium-form"
id="addTransactionSection">

<div class="form-heading">

<div>

<p class="page-eyebrow">
Quick Entry
</p>

<h3>Add Transaction</h3>

</div>

<div class="form-icon">

<i class="ph-duotone ph-plus-circle"></i>

</div>

</div>

<div class="form-grid premium-form-grid">

<label>

<span>Transaction name</span>

<div class="input-shell">

<i class="ph-duotone ph-pencil-simple"></i>

<input
id="title"
type="text"
placeholder="Coffee, Salary, Shopping...">

</div>

</label>

<label>

<span>Amount</span>

<div class="input-shell">

<i class="ph-duotone ph-currency-circle-dollar"></i>

<input
id="amount"
type="number"
min="0"
step="0.01"
placeholder="0.00">

</div>

</label>

<label>

<span>Category</span>

<div class="input-shell">

<i class="ph-duotone ph-tag"></i>

<select id="category">

<option value="Food">Food</option>
<option value="Transport">Transport</option>
<option value="Shopping">Shopping</option>
<option value="Bills">Bills</option>
<option value="Entertainment">Entertainment</option>
<option value="Salary">Salary</option>
<option value="Other">Other</option>

</select>

</div>

</label>

<label>

<span>Type</span>

<div class="input-shell">

<i class="ph-duotone ph-arrows-down-up"></i>

<select id="type">

<option value="expense">Expense</option>
<option value="income">Income</option>

</select>

</div>

</label>

<label class="date-field">

<span>Date</span>

<div class="input-shell">

<i class="ph-duotone ph-calendar-blank"></i>

<input
id="date"
type="date">

</div>

</label>

</div>

<button
class="save-main-btn"
onclick="addTransaction()">

<i class="ph-duotone ph-check-circle"></i>

Save Transaction

</button>

</section>

<section class="transaction glass transaction-list-card">

<div class="transaction-header">

<div>

<p class="page-eyebrow">
History
</p>

<h3>All Transactions</h3>

</div>

<div class="filter-area">

<div class="search-box">

<i class="ph-duotone ph-magnifying-glass"></i>

<input
id="searchInput"
type="search"
placeholder="Search transaction..."
oninput="filterLocal()">

</div>

<div class="select-filter">

<i class="ph-duotone ph-funnel"></i>

<select
id="filterType"
onchange="filterLocal()">

<option value="">All types</option>
<option value="income">Income</option>
<option value="expense">Expense</option>

</select>

</div>

</div>

</div>

<div id="transaction-list">

<div class="loading-state">

<div class="loading-spinner"></div>

<p>Loading transactions...</p>

</div>

</div>

</section>

</main>

</div>

<div
class="modal"
id="editModal">

<div class="modal-content glass edit-transaction-modal">

<div class="modal-top">

<div>

<p class="page-eyebrow">
Update Record
</p>

<h2>Edit Transaction</h2>

</div>

<button
class="modal-close"
onclick="closeEdit()">

<i class="ph-duotone ph-x"></i>

</button>

</div>

<div class="modal-form">

<label>

Title

<div class="input-shell">

<i class="ph-duotone ph-pencil-simple"></i>

<input
id="editTitle"
type="text">

</div>

</label>

<label>

Amount

<div class="input-shell">

<i class="ph-duotone ph-currency-circle-dollar"></i>

<input
id="editAmount"
type="number"
min="0"
step="0.01">

</div>

</label>

<label>

Category

<div class="input-shell">

<i class="ph-duotone ph-tag"></i>

<select id="editCategory">

<option value="Food">Food</option>
<option value="Transport">Transport</option>
<option value="Shopping">Shopping</option>
<option value="Bills">Bills</option>
<option value="Entertainment">Entertainment</option>
<option value="Salary">Salary</option>
<option value="Other">Other</option>

</select>

</div>

</label>

<label>

Type

<div class="input-shell">

<i class="ph-duotone ph-arrows-down-up"></i>

<select id="editType">

<option value="expense">Expense</option>
<option value="income">Income</option>

</select>

</div>

</label>

<label>

Date

<div class="input-shell">

<i class="ph-duotone ph-calendar-blank"></i>

<input
id="editDate"
type="date">

</div>

</label>

</div>

<div class="modal-buttons">

<button
class="cancel-edit-btn"
onclick="closeEdit()">

Cancel

</button>

<button
class="save-edit-btn"
onclick="updateTransaction()">

<i class="ph-duotone ph-check"></i>

Save Changes

</button>

</div>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
